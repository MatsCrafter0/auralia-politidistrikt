<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auralia Politidistrikt | Politihåndbok</title><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eaf0f9;background:#0b1424}*{box-sizing:border-box}body{margin:0}header{height:78px;background:#101e34;border-bottom:1px solid #2c4162;display:flex;align-items:center;gap:14px;padding:0 25px;position:sticky;top:0;z-index:5}header img{height:51px;width:51px;object-fit:contain}header strong{font-size:19px}header small{display:block;color:#a9bad3;margin-top:4px}main{display:grid;grid-template-columns:295px minmax(0,1fr);min-height:calc(100vh - 78px)}aside{background:#101b2e;border-right:1px solid #293a56;padding:22px 14px;overflow:auto;height:calc(100vh - 78px);position:sticky;top:78px}#search{width:100%;padding:12px;border-radius:8px;background:#182941;color:white;border:1px solid #36506f;margin-bottom:16px}nav a{display:block;color:#c9d7e8;text-decoration:none;padding:9px 12px;border-radius:7px;font-size:14px}nav a:hover,nav a.active{background:#203c62;color:white}nav a.child{padding-left:27px;font-size:13px}article{max-width:960px;width:100%;padding:35px 48px 90px;margin:0 auto;line-height:1.75;color:#d8e2ef}article h1{font-size:35px;line-height:1.2;color:white}article h2{margin-top:38px;border-bottom:1px solid #30435e;padding-bottom:10px;color:white}article h3{color:#f0f5ff}article a{color:#8bc6ff}article blockquote{border-left:3px solid #a4c8ef;margin:20px 0;padding:5px 18px;background:#13253b}article table{border-collapse:collapse;display:block;overflow:auto}article td,article th{border:1px solid #3a4c66;padding:9px}article code{background:#1e3452;padding:3px 5px}article img{max-width:100%}.crumb{color:#9bb0cc;font-size:13px}#pager{display:flex;justify-content:space-between;gap:12px;margin-top:45px}#pager a{color:#b6d8ff}#menu{display:none}footer{font-size:12px;color:#7d91ad;padding:12px 25px;background:#101b2e}@media(max-width:760px){header{padding:0 12px}header strong{font-size:15px}#menu{display:block;margin-left:auto;background:#243c5b;color:white;border:0;padding:10px;border-radius:7px}main{display:block}aside{display:none;position:fixed;top:78px;left:0;width:85vw;height:calc(100vh - 78px);z-index:4;box-shadow:10px 0 20px #0007}aside.open{display:block}article{padding:22px 19px 65px}article h1{font-size:28px}}</style></head><body><header><img src="auralia-politi-logo.png" onerror="this.style.display='none'" alt="Politilogo"><div><strong>Auralia Politidistrikt</strong><small>Politihåndbok · UNIT RP</small></div><button id="menu">☰ Meny</button></header><main><aside id="aside"><input id="search" placeholder="Søk i kapitler …"><nav id="nav"></nav></aside><article><div class="crumb" id="crumb"></div><div id="content"></div><div id="pager"></div></article></main><footer>Auralia Politidistrikt · Fiktiv polititjeneste i FiveM-rollespill</footer><script>let pages=[],byId={},byPath={};const nav=document.getElementById('nav'),article=document.getElementById('content');function href(p){return '#/handbok/'+p.path}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}function renderNav(q=''){nav.innerHTML=pages.filter(p=>p.title.toLowerCase().includes(q.toLowerCase())).map(p=>'<a class="'+(p.path.includes('/')?'child ':'')+(decodeURIComponent(location.hash)==href(p)?'active':'')+'" href="'+href(p)+'">'+esc(p.title)+'</a>').join('')}async function render(){const path=decodeURIComponent(location.hash).replace(/^#\/handbok\//,'');const p=byPath[path]||pages[0];if(!p)return;document.getElementById('crumb').textContent='Auralia Politihåndbok / '+p.title;article.textContent='Laster inn…';try{let response=await fetch('innhold/'+p.path+'.md');if(!response.ok)throw Error('Kunne ikke hente kapitlet');let md=(await response.text()).replace(/^---\n[\s\S]*?\n---\n/,'');article.innerHTML=marked.parse(md);article.querySelectorAll('a[href]').forEach(a=>{const m=a.getAttribute('href').match(/^\/pages\/([^?#]+)/);if(m&&byId[m[1]])a.href=href(byId[m[1]]);});}catch(e){article.textContent=e.message}let i=pages.indexOf(p);document.getElementById('pager').innerHTML=(i>0?'<a href="'+href(pages[i-1])+'">← '+esc(pages[i-1].title)+'</a>':'<span></span>')+(i<pages.length-1?'<a href="'+href(pages[i+1])+'">'+esc(pages[i+1].title)+' →</a>':'');renderNav(document.getElementById('search').value);document.getElementById('aside').classList.remove('open');window.scrollTo(0,0)}document.getElementById('search').addEventListener('input',e=>renderNav(e.target.value));document.getElementById('menu').onclick=()=>document.getElementById('aside').classList.toggle('open');window.addEventListener('hashchange',render);fetch('navigasjon.json').then(r=>r.json()).then(p=>{pages=p;byId=Object.fromEntries(p.map(x=>[x.id,x]));byPath=Object.fromEntries(p.map(x=>[x.path,x]));render()}).catch(()=>article.textContent='Kunne ikke laste inn navigasjonen');</script></body></html>
