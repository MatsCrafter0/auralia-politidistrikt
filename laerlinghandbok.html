<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lærlinghåndbok – Auralia Politidistrikt</title><script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf3fa;background:#09111e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#143448 0,transparent 48%),#09111e}a{color:#73e5d0}header{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 5%;border-bottom:1px solid #ffffff22;background:#0c1625}.logo{text-decoration:none;color:#eaf3fa;font-weight:750}.logo span{color:#73e5d0}.back{color:#8be8d8;text-decoration:none;font-size:14px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 132px)}aside{padding:30px 18px;background:#0d1b2b;border-right:1px solid #ffffff20}aside h2{font-size:15px;color:#7ce4d0;margin:0 12px 22px}nav{display:grid;gap:7px}nav a{color:#b9c9d7;text-decoration:none;padding:12px 13px;border-radius:10px;font-size:14px;line-height:1.45}nav a:hover,nav a.active{background:#1e4650;color:#a6ffee}article{width:100%;max-width:900px;padding:52px clamp(22px,5vw,72px) 90px;line-height:1.8;color:#d7e6ee}article h1{font-size:clamp(28px,4vw,42px);line-height:1.2;color:#fff}article h2{font-size:25px;margin-top:35px;color:#fff}article h3{font-size:20px;color:#b4f1e5}article li{margin:7px 0}article strong{color:#fff}article a{overflow-wrap:anywhere}article code{background:#1a3542;padding:3px 6px;border-radius:5px}article blockquote{border-left:3px solid #6ee7d1;padding-left:16px;color:#adc7d0}.pager{display:flex;justify-content:space-between;gap:20px;margin-top:45px;border-top:1px solid #ffffff22;padding-top:24px}.pager a{text-decoration:none;font-size:14px}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;color:#75e4cf}.menu{display:none;border:1px solid #567680;border-radius:8px;background:#153342;color:#fff;padding:9px 12px;cursor:pointer}footer{text-align:center;color:#8ea6b6;padding:22px;border-top:1px solid #ffffff18}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:none;border-bottom:1px solid #ffffff22}aside.open{display:block}.menu{display:block}article{padding:30px 22px 60px}}
</style></head><body><header><a class="logo" href="./#/">Auralia <span>Politidistrikt</span></a><a class="back" href="./#/">← Til forsiden</a><button id="menu" class="menu" aria-label="Vis kapitler">☰ Kapitler</button></header><div class="layout"><aside id="aside"><h2>LÆRLINGHÅNDBOK</h2><nav id="nav"></nav></aside><article><span class="eyebrow">POLITIHØGSKOLEN · BRAVO / LIMA</span><div id="content">Laster håndboken …</div><div class="pager" id="pager"></div></article></div><footer>Auralia Politidistrikt · Lærlinghåndbok</footer><script>
const chapters=[["velkommen","Velkommen og oversikt"],["felt-og-grunnkurs","Feltgodkjenning og grunnkurs"],["praktisk-tjeneste","Praktisk patruljetjeneste"],["jus-og-utrykning","Jus og K160"],["vapen-og-scenario","Våpen, operativ trening og scenario"],["forventninger-og-varighet","Forventninger og studentperiode"],["krav-og-slutteksamen","Krav og slutteksamen"],["etter-eksamen","Etter eksamen og mål"]];const nav=document.getElementById('nav'),content=document.getElementById('content'),pager=document.getElementById('pager');const link=slug=>'#/kapittel/'+slug;function render(){const slug=decodeURIComponent(location.hash.replace(/^#\/kapittel\//,''));const i=Math.max(0,chapters.findIndex(c=>c[0]===slug));nav.replaceChildren();for(const [key,title] of chapters){const a=document.createElement('a');a.href=link(key);a.textContent=title;if(key===chapters[i][0])a.className='active';nav.append(a)}pager.replaceChildren();if(i>0){const a=document.createElement('a');a.href=link(chapters[i-1][0]);a.textContent='← '+chapters[i-1][1];pager.append(a)}else pager.append(document.createElement('span'));if(i<chapters.length-1){const a=document.createElement('a');a.href=link(chapters[i+1][0]);a.textContent=chapters[i+1][1]+' →';pager.append(a)}content.textContent='Laster kapitlet …';fetch('innhold/laerlinghandbok/'+chapters[i][0]+'.md').then(r=>{if(!r.ok)throw Error('Kapitlet kunne ikke lastes');return r.text()}).then(t=>{content.innerHTML=marked.parse(t)}).catch(e=>content.textContent=e.message);document.getElementById('aside').classList.remove('open');window.scrollTo(0,0)}document.getElementById('menu').onclick=()=>document.getElementById('aside').classList.toggle('open');window.addEventListener('hashchange',render);render();
</script></body></html>
